<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация — Pricing.su</title>
<meta name="description" content="Регистрация в сервисе Pricing.su">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">

<main class="auth-main container" id="main">
  <div class="auth-shell">
    <a href="index.html" class="auth-brand">
      <svg class="auth-brand-mark" viewBox="100 80 1080 1140" aria-hidden="true" focusable="false"><use href="assets/pricing-label-rocket-flourish.svg#pricing-label-flourish"/></svg>
      <span class="auth-brand-wordmark">Pricing.su</span>
    </a>
    <div class="lead-panel">
      <form class="form-wrap lead-form" data-auth-next="register-sent.html" data-auth-require-consent="true" action="register-sent.html" method="get" aria-label="Регистрация">

      <input type="text" id="reg-name" name="name" autocomplete="name" placeholder="Имя" required>
      <input type="email" id="reg-email" name="email" autocomplete="email" placeholder="Email" required>
      <input type="tel" id="reg-phone" name="phone" autocomplete="tel" placeholder="Телефон">

      <label class="lead-consent">
        <input type="checkbox" name="consent" required>
        <span>Я соглашаюсь на обработку персональных данных и принимаю <a href="index.html" onclick="return false">политику конфиденциальности</a></span>
      </label>

      <button type="submit" class="btn btn-cta">Зарегистрироваться</button>

      <div class="auth-form-links">
        <a href="reset-password.html">Забыли пароль?</a>
        <a href="login.html">Вход</a>
      </div>
      </form>
    </div>
  </div>
</main>

<script src="auth.js"></script>
</body>
</html>
