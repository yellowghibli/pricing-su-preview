<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Письмо отправлено — Pricing.su</title>
<meta name="description" content="Инструкция по сбросу пароля Pricing.su">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">

<main class="auth-main container" id="main">
  <div class="auth-shell">
    <a href="index.html" class="auth-brand">
      <svg class="auth-brand-mark" viewBox="100 80 1080 1140" aria-hidden="true" focusable="false"><use href="assets/pricing-label-rocket-flourish.svg#pricing-label-flourish"/></svg>
      <span class="auth-brand-wordmark">Pricing.su</span>
    </a>
    <div class="auth-panel-plain">
      <div class="auth-message">
        <h1 class="auth-message-title">Письмо для сброса пароля</h1>
        <div class="auth-message-body">
          <p>На вашу почту пришло письмо со ссылкой для смены пароля. Откройте его и перейдите по ссылке.</p>
          <p>Не видите письмо? Загляните в «Спам».</p>
          <p>Если что-то не получается — напишите нам на <a href="mailto:support@pricing.su">support@pricing.su</a>, поможем.</p>
        </div>
        <a href="login.html" class="btn btn-cta">Вернуться ко входу</a>
      </div>
    </div>
  </div>
</main>

</body>
</html>
