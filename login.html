<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Pricing.su</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="description" content="Вход в личный кабинет Pricing.su">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">

<main class="auth-main container" id="main">
  <div class="auth-shell">
    <a href="index.html" class="auth-brand">
      <svg class="auth-brand-mark" viewBox="100 80 1080 1140" aria-hidden="true" focusable="false"><use href="assets/pricing-label-rocket-flourish.svg#pricing-label-flourish"/></svg>
      <span class="auth-brand-wordmark">Pricing.su</span>
    </a>
    <div class="lead-panel">
      <form class="form-wrap lead-form" data-auth-next="index.html" action="index.html" method="get" aria-label="Вход в кабинет">

      <input type="email" id="login-email" name="email" autocomplete="email" placeholder="Email" required>

      <div class="auth-input-wrap">
        <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="Пароль" required>
        <button type="button" class="auth-toggle-pw" data-toggle-password aria-controls="login-password" aria-pressed="false" aria-label="Показать пароль">
          <svg class="auth-toggle-icon auth-toggle-icon--show" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
            <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <svg class="auth-toggle-icon auth-toggle-icon--hide" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>
          </svg>
        </button>
      </div>

      <button type="submit" class="btn btn-cta">Войти</button>

      <p class="auth-or" aria-hidden="true">или</p>

      <a href="https://panel.pricing.su/login" class="btn btn-outline" target="_blank" rel="noopener noreferrer">Попробовать через демо-доступ</a>

      <p class="form-note">
        <span class="form-note-line"><a href="reset-password.html">Забыли пароль?</a></span>
        <span class="form-note-line">Нет учётной записи? <a href="register.html">Регистрация</a></span>
      </p>
      </form>
    </div>
  </div>
</main>

<script src="auth.js"></script>
</body>
</html>
